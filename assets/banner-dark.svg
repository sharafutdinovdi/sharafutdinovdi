<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Dinar Sharafutdinov , BIM / Revit Developer">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="16" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="#30363d"/>

  <!-- Revit-style plan: grid lines with bubbles, walls, section mark -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <g stroke="#3d444d" stroke-width="1.2" stroke-dasharray="14 5 3 5">
      <line x1="740" y1="62" x2="740" y2="262"/>
      <line x1="840" y1="62" x2="840" y2="262"/>
      <line x1="940" y1="62" x2="940" y2="262"/>
      <line x1="1040" y1="62" x2="1040" y2="262"/>
      <line x1="700" y1="102" x2="1110" y2="102"/>
      <line x1="700" y1="172" x2="1110" y2="172"/>
      <line x1="700" y1="242" x2="1110" y2="242"/>
    </g>
    <g fill="#0d1117" stroke="#3d444d" stroke-width="1.5">
      <circle cx="740" cy="46" r="15"/><circle cx="840" cy="46" r="15"/><circle cx="940" cy="46" r="15"/><circle cx="1040" cy="46" r="15"/>
      <circle cx="1128" cy="102" r="15"/><circle cx="1128" cy="172" r="15"/><circle cx="1128" cy="242" r="15"/>
    </g>
    <g fill="#9198a1" text-anchor="middle" dominant-baseline="central">
      <text x="740" y="46">A</text><text x="840" y="46">B</text><text x="940" y="46">C</text><text x="1040" y="46">D</text>
      <text x="1128" y="102">1</text><text x="1128" y="172">2</text><text x="1128" y="242">3</text>
    </g>
    <!-- walls -->
    <g fill="none" stroke="#c9d1d9" stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt">
      <path d="M740 102 H1040 V242 H840 V172 H740 Z"/>
    </g>
    <!-- highlighted element (selected family) -->
    <g>
      <rect x="882" y="112" width="60" height="28" rx="2" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff" stroke-width="1.5"/>
      <line x1="882" y1="126" x2="942" y2="126" stroke="#58a6ff" stroke-width="1.5"/>
      <circle cx="912" cy="126" r="3" fill="#58a6ff"/>
    </g>
    <!-- section mark -->
    <g stroke="#58a6ff" stroke-width="2" fill="none">
      <line x1="790" y1="205" x2="990" y2="205" stroke-dasharray="6 4"/>
      <path d="M790 197 V213 M990 197 V213"/>
      <path d="M782 213 L790 205 L782 197" fill="#58a6ff"/>
      <path d="M998 213 L990 205 L998 197" fill="#58a6ff"/>
    </g>
    <!-- door swing -->
    <path d="M840 205 A 33 33 0 0 1 873 172" fill="none" stroke="#c9d1d9" stroke-width="1.5"/>
    <line x1="840" y1="205" x2="840" y2="172" stroke="#c9d1d9" stroke-width="2"/>
    <text x="702" y="284" font-size="11" fill="#9198a1" font-weight="500">1 : 100</text>
  </g>
  <rect x="640" y="0" width="140" height="300" fill="url(#fade)"/>

  <!-- text block -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="96" font-size="15" font-weight="600" letter-spacing="3" fill="#58a6ff">BIM / REVIT DEVELOPER</text>
    <text x="64" y="150" font-size="46" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">Dinar Sharafutdinov</text>
    <text x="64" y="188" font-size="18" fill="#9198a1">Revit add-ins in C# / .NET · AEC web platforms · AI-assisted engineering pipelines</text>
    <g font-size="13" font-weight="600" fill="#c9d1d9">
      <rect x="64" y="216" width="72" height="28" rx="14" fill="#21262d"/><text x="100" y="230" text-anchor="middle" dominant-baseline="central">C# / .NET</text>
      <rect x="144" y="216" width="80" height="28" rx="14" fill="#21262d"/><text x="184" y="230" text-anchor="middle" dominant-baseline="central">Revit API</text>
      <rect x="232" y="216" width="52" height="28" rx="14" fill="#21262d"/><text x="258" y="230" text-anchor="middle" dominant-baseline="central">WPF</text>
      <rect x="292" y="216" width="72" height="28" rx="14" fill="#21262d"/><text x="328" y="230" text-anchor="middle" dominant-baseline="central">Dynamo</text>
      <rect x="372" y="216" width="74" height="28" rx="14" fill="#21262d"/><text x="409" y="230" text-anchor="middle" dominant-baseline="central">pyRevit</text>
      <rect x="454" y="216" width="98" height="28" rx="14" fill="#21262d"/><text x="503" y="230" text-anchor="middle" dominant-baseline="central">TypeScript</text>
      <rect x="560" y="216" width="68" height="28" rx="14" fill="#21262d"/><text x="594" y="230" text-anchor="middle" dominant-baseline="central">Python</text>
    </g>
  </g>
</svg>
